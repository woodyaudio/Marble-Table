<style>

    #game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100%;
        background: var(--bg-app);
        overflow-y: auto;
        overflow-x: hidden;

        box-sizing: border-box;
        font-family: 'Nunito', 'Noto Sans KR', sans-serif;

    }

    /* --- Header --- */
    .roulette-header {
        text-align: center;
        color: var(--text-primary);
        margin-bottom: 5px;
    }
    .roulette-header h1 {
        font-family: 'Nunito', sans-serif;
        font-size: 1.7rem;
        font-weight: 900;
        letter-spacing: -1px;
        line-height: 1.1;
        transition: all 0.3s ease;
    }
    @media (max-width: 768px) {
        .roulette-header h1 { font-size: 1.4rem; }
        .roulette-header p { font-size: 0.75rem; }
    }
    .roulette-header p {
        font-size: 0.85rem;
        color: var(--text-secondary);

    /* --- Game Type Toggle (점심 / 커피) --- */

    /* --- 자동 배치 버튼 + 칸(직접 입력) 목록 --- */

        width: 100%;

    .auto-arrange-btn {

        border-radius: 50px;
        border: 1px solid var(--border-light);
        background: var(--bg-surface);
        color: var(--text-primary);

        font-size: 0.82rem;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: all 0.2s ease;
    }
    .auto-arrange-btn:hover { opacity: 0.85; }
    .auto-arrange-btn:active { transform: scale(0.97); }

    /* --- 휠 위에 떠서 나타나는 칸 편집기 --- */
    /* 칸을 목록으로 따로 안 두고, 이미 나뉜 휠 조각을 탭하면 그 자리 바로 위에
       입력창이 뜨는 방식(불필요하게 칸을 더 쓰지 않기 위함) */
    .roulette-slot-editor {
        position: absolute;
        width: 150px;
        z-index: 70;
    }
    .roulette-slot-editor input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 8px;
        border: 2px solid var(--primary, #3b82f6);
        background: var(--bg-surface);
        color: var(--text-primary);
        font-size: 0.78rem;
        font-weight: 700;
        font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .roulette-slot-editor-dropdown {
        margin-top: 4px;
        max-height: 160px;
        overflow-y: auto;
        background: var(--bg-surface);
        border: 1px solid var(--border-light);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .roulette-slot-option {
        padding: 7px 9px;
        font-size: 0.76rem;
        font-weight: 600;
        cursor: pointer;
    }
    .roulette-slot-option:hover { background: rgba(255,255,255,0.08); }
    .roulette-slot-option.empty { color: var(--text-secondary); font-weight: 500; cursor: default; }
    .roulette-slot-option.clear { color: #ef4444; }

    /* --- Wheel Area --- */
    .wheel-area {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;

        width: min(42vh, 420px, calc(100vw - 40px));
        height: min(42vh, 420px, calc(100vw - 40px));
    }

    @media (max-width: 768px) {
        .wheel-area {
            /* 90px 광고 대응을 위해 휠 사이즈 대폭 축소 */
            width: min(35vh, 290px);
            height: min(35vh, 290px);
        }
    }

    .wheel-pointer {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 28px solid #FFD700;
        filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
        z-index: 10;
    }
    @media (max-width: 768px) {
        .wheel-pointer {
            border-top-width: 22px;
            border-left-width: 11px;
            border-right-width: 11px;
            top: -8px;
        }
    }
    canvas {
        border-radius: 50%;
        box-shadow: 0 0 0 6px var(--bg-surface), 0 0 40px rgba(0,0,0,0.15);
        display: block;
        width: 100% !important;
        height: 100% !important;
    }

    /* --- Spin Button --- */
    .spin-btn {
        background: var(--text-primary);
        color: var(--bg-app);
        border: none;
        border-radius: 50px;
        padding: 12px 44px;
        font-family: 'Nunito', 'Noto Sans KR', sans-serif;
        font-weight: 900;
        font-size: 1.05rem;
        cursor: pointer;
        letter-spacing: 0.5px;
        box-shadow: 0 6px 20px var(--primary-light);
        transition: all 0.2s ease;
        flex-shrink: 0;
    }
    @media (max-width: 768px) {
        .spin-btn { padding: 11px 36px; font-size: 0.95rem; }
    }
    .spin-btn:hover:not(:disabled) { opacity: 0.88; }
    .spin-btn:active:not(:disabled) { transform: scale(0.97); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* --- Result Card --- */
    .result-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-light);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 20px;
        padding: 16px 20px;
        text-align: center;
        color: var(--text-primary);
        width: 100%;
        max-width: 320px;
        box-shadow: var(--shadow-lg);
        transition: all 0.4s ease;
        flex-shrink: 0;
        min-height: 135px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-top: 10px;
    }
    @media (max-width: 768px) {
        .result-card { min-height: 120px; padding: 8px 14px; margin-top: 5px; }
    }
    .result-card.visible {
        opacity: 1;
        transform: scale(1.02);
    }
    .result-label {
        font-size: 0.72rem;
        color: var(--text-secondary);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 6px;
        font-weight: 800;
    }
    .result-name {
        font-family: 'Nunito', sans-serif;
        font-size: 1.35rem;
        font-weight: 900;
        color: var(--text-primary);
        margin-bottom: 6px;
        line-height: 1.2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .result-name .emoji-icon {
        font-size: 2rem;
    }
    .result-meta {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 10px;
        font-weight: 700;
    }
    .result-links {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .result-link-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 14px;
        border-radius: 50px;
        font-size: 0.75rem;
        font-weight: 800;
        font-family: 'Nunito', 'Noto Sans KR', sans-serif;
        text-decoration: none;
        transition: all 0.2s ease;
        border: 1px solid var(--border-light);
        color: var(--text-primary);
        background: var(--bg-panel);
        cursor: pointer;
    }
    .result-link-btn:hover {
        background: rgba(12,48,96,0.12);
        transform: scale(1.04);
    }
    .result-link-btn.instagram { background: linear-gradient(135deg, rgba(193,53,132,0.15), rgba(253,81,29,0.15)); border-color: rgba(253,81,29,0.3); color: #c13584; }
    .result-link-btn.kakao { background: rgba(254,229,0,0.35); border-color: rgba(200,160,0,0.35); color: #3C1E1E; }

</style>

<div id="game-container">
    <div class="roulette-header">
        <h1 id="mainTitle">🍽️ 점심 룰렛</h1>
        <p id="mainSubtitle">오늘 뭐 먹을지 결정 못 하겠다면?</p>
    </div>

    <!-- 모드 토글 (미니/일반) -->
    <div class="mode-toggle">
        <button class="mode-btn active" id="btnMini" onclick="setGlobalMode('mini')">⚡ 미니</button>
        <button class="mode-btn" id="btnFull" onclick="setGlobalMode('full')">🌐 일반</button>
    </div>

    <!-- 자동 배치(가까운 순) — 조각 직접 입력은 아래 휠을 탭해서 -->
    <div class="roulette-config">
        <button class="auto-arrange-btn" onclick="roulette.autoArrange()">🎯 자동 배치</button>
    </div>

    <!-- 점심 룰렛 영역: 조각을 탭하면 그 자리에 입력창이 뜸(칸을 별도로 안 씀) -->
    <div class="wheel-area" id="wheelArea">
        <div class="wheel-pointer"></div>
        <canvas id="rouletteCanvas"></canvas>
        <div id="rouletteSlotEditor" class="roulette-slot-editor" hidden>
            <input type="text" id="rouletteSlotEditorInput" placeholder="가게 이름 입력" autocomplete="off"
                   oninput="roulette.onEditorInput()">
            <div id="rouletteSlotEditorDropdown" class="roulette-slot-editor-dropdown"></div>
        </div>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="roulette.spin()">🎰 돌려돌려!</button>
    <div class="result-card visible" id="resultCard">
        <div class="result-label" id="resultLabel">오늘의 점심은</div>
        <div class="result-name" id="resultName"><span class="emoji-icon">🤔</span> 무엇이 나올까요?</div>
        <div class="result-meta" id="resultMeta">돌려돌려 버튼을 눌러보세요!</div>
        <div class="result-links" id="resultLinks"></div>
    </div>
</div>

<script>
// =============================================
//  모드 전환 (미니 ↔ 일반)
//  ※ 커피 룰렛(2층/3층/외출/1층 하드코딩)은 특정 사무실 층 구조라 다른
//     사용자에게 의미가 없어 폐기함 — 기획서 04번 참고.
// =============================================
function setGlobalMode(mode) {
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active',
            (mode === 'mini' && btn.id === 'btnMini') ||
            (mode === 'full' && btn.id === 'btnFull')
        );
    });
    roulette.setMode(mode);
    roulette.resetLunchResult();
}

// =============================================
//  점심 룰렛
// =============================================
window.roulette = (function() {
    // 옛 가산디지털단지 14곳 하드코딩 리스트 대신 실제 DB(data/restaurants.xlsx)를 사용.
    // 탭에 들어가면 칸을 비워두고(자동으로 아무 식당이나 채우지 않음), "자동 배치"
    // 버튼으로 거리순 채우기를 하거나, 이미 나뉜 휠 조각을 탭해서 그 자리에 뜨는
    // 입력창에 가게 이름을 직접 입력해 채울 수 있음(별도 칸 목록을 두지 않음).
    // 기획서 04번 참고.
    const POOL_SIZE_MINI = 4;
    const POOL_SIZE_FULL = 12;
    const MAX_SUGGESTIONS = 6; // 타이핑할 때 아래에 보여줄 후보 목록 최대 개수

    let restaurantsFull = [];   // xlsx에서 로드한 노출 대상 전체 식당
    let dataLoadPromise = null;
    let slots = [];              // index = 조각 번호, 값 = 매칭된 식당 객체 | null(빈 조각)
    let currentMode = 'mini';
    let activeEditorSlot = null; // 현재 편집 중인 조각 번호(없으면 null)
    let isSpinning = false;
    let currentAngle = 0;

    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');

    function getDistanceKm(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function loadRestaurants() {
        if (dataLoadPromise) return dataLoadPromise;
        dataLoadPromise = (async () => {
            const res = await fetch(`./data/restaurants.xlsx?v=${Date.now()}`);
            if (!res.ok) throw new Error(`HTTP error! ${res.status}`);
            const arrayBuffer = await res.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

            const headerMap = {
                'id': 'id', '이름': 'name', '지역': 'region', 'lat': 'lat', 'lng': 'lng',
                '가격': 'price', '영업 시간': 'hours', '인스타': 'instagram', '카카오': 'kakaoChannel',
                '노출여부': 'visibility'
            };
            const headers = rows[0].map(h => headerMap[String(h).trim()] || String(h).trim());

            restaurantsFull = rows.slice(1)
                .map(row => { const obj = {}; headers.forEach((key, i) => { obj[key] = row[i]; }); return obj; })
                .filter(r => r.name && String(r.name).trim() !== '' && String(r.name).trim() !== 'Dev_Test')
                .map((r, index) => ({
                    id: parseInt(r.id) || (index + 1),
                    name: String(r.name).trim(),
                    lat: parseFloat(r.lat) || 0,
                    lng: parseFloat(r.lng) || 0,
                    price: parseInt(r.price) || 0,
                    hours: r.hours ? String(r.hours).trim() : '',
                    instagram: (r.instagram && String(r.instagram).trim() !== '' && String(r.instagram).trim().toLowerCase() !== 'null') ? String(r.instagram).trim() : null,
                    kakao: (r.kakaoChannel && String(r.kakaoChannel).trim() !== '' && String(r.kakaoChannel).trim().toLowerCase() !== 'null') ? String(r.kakaoChannel).trim() : null,
                    visibility: r.visibility ? String(r.visibility).trim() : ''
                }))
                // 노출여부가 '비공개'/'확인필요'인 식당은 지도와 동일하게 후보에서 제외
                .filter(r => !(r.visibility.startsWith('비공개') || r.visibility.startsWith('확인필요')));

            return restaurantsFull;
        })();
        return dataLoadPromise;
    }

    function slotCount() { return currentMode === 'mini' ? POOL_SIZE_MINI : POOL_SIZE_FULL; }

    function escapeHtmlLocal(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // 조각(캔버스)을 탭했을 때 그 자리에 뜨는 입력창 — 별도 칸 목록 없이 휠 위에서
    // 바로 입력하기 위함. x, y는 wheelArea 기준 좌표.
    function openSlotEditor(idx, x, y) {
        activeEditorSlot = idx;
        const editor = document.getElementById('rouletteSlotEditor');
        const input = document.getElementById('rouletteSlotEditorInput');
        const area = document.getElementById('wheelArea');
        if (!editor || !input || !area) return;
        const areaRect = area.getBoundingClientRect();
        const editorWidth = 150;
        const left = Math.max(4, Math.min(x - editorWidth / 2, areaRect.width - editorWidth - 4));
        const top = Math.max(4, Math.min(y - 16, areaRect.height - 40));
        editor.style.left = left + 'px';
        editor.style.top = top + 'px';
        editor.hidden = false;
        input.value = slots[idx] ? slots[idx].name : '';
        input.focus();
        renderEditorDropdown('');
    }

    function closeSlotEditor() {
        const editor = document.getElementById('rouletteSlotEditor');
        if (editor) editor.hidden = true;
        const dd = document.getElementById('rouletteSlotEditorDropdown');
        if (dd) dd.innerHTML = '';
        activeEditorSlot = null;
    }

    function onEditorInput() {
        const input = document.getElementById('rouletteSlotEditorInput');
        if (input) renderEditorDropdown(input.value.trim());
    }

    // q가 비어있고 현재 조각이 채워져 있으면 "비우기" 액션을, 타이핑하면 이름이
    // 포함되는(이미 다른 조각에 쓰인 건 제외) 후보를 보여준다.
    function renderEditorDropdown(q) {
        const dd = document.getElementById('rouletteSlotEditorDropdown');
        if (!dd || activeEditorSlot === null) return;
        let rows = [];
        if (!q && slots[activeEditorSlot]) {
            rows.push(`<div class="roulette-slot-option clear" onclick="roulette.clearEditorSlot()">✕ 비우기</div>`);
        }
        if (q) {
            const usedIds = new Set(slots.filter((r, i) => r && i !== activeEditorSlot).map(r => r.id));
            const matches = restaurantsFull.filter(r => r.name.includes(q) && !usedIds.has(r.id)).slice(0, MAX_SUGGESTIONS);
            rows = rows.concat(matches.length
                ? matches.map(r => `<div class="roulette-slot-option" onclick="roulette.pickEditorOption(${r.id})">${escapeHtmlLocal(r.name)}</div>`)
                : [`<div class="roulette-slot-option empty">일치하는 가게가 없어요</div>`]);
        }
        dd.innerHTML = rows.join('');
    }

    function pickEditorOption(id) {
        if (activeEditorSlot === null) return;
        const r = restaurantsFull.find(x => x.id === id);
        if (!r) return;
        slots[activeEditorSlot] = r;
        closeSlotEditor();
        renderWheelFromSlots();
    }

    function clearEditorSlot() {
        if (activeEditorSlot === null) return;
        slots[activeEditorSlot] = null;
        closeSlotEditor();
        renderWheelFromSlots();
    }

    // "🎯 자동 배치": 아직 비어있는 조각에만 거리순(회사→집 위치 기준, 둘 다 없으면
    // 등록 순서)으로 채운다. 이미 채워진 조각(직접 입력분 포함)은 그대로 두고,
    // 이미 다른 조각에 쓰인 가게는 후보에서 제외해 중복을 피한다.
    function autoArrange() {
        loadRestaurants().then(() => {
            const usedIds = new Set(slots.filter(Boolean).map(r => r.id));
            const homeLoc = localStorage.getItem('woody_home_loc') ? JSON.parse(localStorage.getItem('woody_home_loc')) : null;
            const companyLoc = localStorage.getItem('woody_company_loc') ? JSON.parse(localStorage.getItem('woody_company_loc')) : null;
            const refLoc = companyLoc || homeLoc || null;

            let candidates = restaurantsFull.filter(r => !usedIds.has(r.id));
            if (refLoc) {
                candidates = candidates.sort((a, b) =>
                    getDistanceKm(refLoc.lat, refLoc.lng, a.lat, a.lng) -
                    getDistanceKm(refLoc.lat, refLoc.lng, b.lat, b.lng)
                );
            }

            let ci = 0;
            const n = slotCount();
            for (let i = 0; i < n; i++) {
                if (slots[i]) continue;
                if (ci >= candidates.length) break;
                slots[i] = candidates[ci++];
            }
            renderWheelFromSlots();
        }).catch(e => {
            console.error('룰렛용 식당 데이터 로드 실패:', e);
        });
    }

    const COLORS = [
        '#3B82F6','#6366F1','#8B5CF6','#EC4899','#EF4444',
        '#F97316','#EAB308','#22C55E','#14B8A6','#06B6D4',
        '#0EA5E9','#84CC16','#A855F7','#F43F5E'
    ];

    function syncCanvasResolution() {
        const area = document.getElementById('wheelArea');
        if (!area) return;
        const size = area.getBoundingClientRect().width;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // 조각(slots)이 바뀔 때마다(직접 입력 확정/비우기, 자동 배치) 호출.
    function renderWheelFromSlots() {
        currentAngle = 0;
        resetLunchResult();
        syncCanvasResolution();
        drawWheel(currentAngle);
        const btn = document.getElementById('spinBtn');
        if (btn) btn.disabled = !slots.some(Boolean);
    }

    function setMode(mode) {
        currentMode = mode;
        slots = new Array(slotCount()).fill(null);
        closeSlotEditor();
        loadRestaurants().then(() => {
            renderWheelFromSlots();
        }).catch(e => {
            console.error('룰렛용 식당 데이터 로드 실패:', e);
            document.getElementById('resultLabel').style.display = 'block';
            document.getElementById('resultName').textContent = '데이터를 불러오지 못했어요 😢';
            document.getElementById('resultMeta').textContent = '새로고침 후 다시 시도해주세요.';
        });
    }

    // 휠은 항상 slotCount()개 조각으로 미리 나뉜 채(피자처럼) 그려짐 — 채워진
    // 조각은 색+이름, 빈 조각은 흐린 색+"+"로 표시. 조각을 탭하면 openSlotEditor.
    function drawWheel(angle) {
        const area = document.getElementById('wheelArea');
        if (!area) return;
        const displaySize = area.getBoundingClientRect().width;
        const cx = displaySize / 2, cy = displaySize / 2;
        const radius = cx - 5;
        const n = slotCount();
        const slice = (2 * Math.PI) / n;

        ctx.clearRect(0, 0, displaySize, displaySize);

        for (let i = 0; i < n; i++) {
            const s = angle + i * slice;
            const e = s + slice;
            const filled = slots[i];

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, s, e);
            ctx.closePath();
            ctx.fillStyle = filled ? COLORS[i % COLORS.length] : 'rgba(148,163,184,0.18)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(s + slice / 2);

            const isMini = n <= 4;
            ctx.textAlign = isMini ? 'center' : 'right';
            ctx.fillStyle = filled ? 'white' : 'rgba(226,232,240,0.85)';
            ctx.shadowColor = 'rgba(0,0,0,0.45)';
            ctx.shadowBlur = 4;
            ctx.font = `bold 16px 'Noto Sans KR', sans-serif`;

            const label = filled
                ? (isMini ? filled.name : (filled.name.length > 7 ? filled.name.slice(0, 7) + '…' : filled.name))
                : '+';

            if (isMini) {
                ctx.fillText(label, radius * 0.55, 16 * 0.35);
            } else {
                ctx.fillText(label, radius - 12, 16 * 0.35);
            }
            ctx.restore();
        }

        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.13);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(1, '#c7d2fe');
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.11, 0, 2 * Math.PI);
        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(0,0,0,0.25)';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // 캔버스를 탭하면 어느 조각을 눌렀는지 각도로 계산해 그 자리에 편집창을 띄움.
    canvas.addEventListener('click', (e) => {
        if (isSpinning) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const cx = rect.width / 2, cy = rect.height / 2;
        const dx = x - cx, dy = y - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > rect.width / 2 || dist < rect.width * 0.11) return; // 원 밖/중앙 로고 클릭 무시
        let theta = Math.atan2(dy, dx);
        if (theta < 0) theta += 2 * Math.PI;
        const n = slotCount();
        const slice = (2 * Math.PI) / n;
        const idx = Math.min(n - 1, Math.floor(theta / slice));
        openSlotEditor(idx, x, y);
    });

    function spin() {
        const filledIndices = slots.map((s, i) => i).filter(i => slots[i]);
        if (isSpinning || !filledIndices.length) return;
        isSpinning = true;
        closeSlotEditor();
        resetLunchResult();

        // 🌀 돌아가는 중 효과
        document.getElementById('resultName').textContent = '🌀 돌아가는 중...';
        document.getElementById('resultMeta').textContent = '두구두구두구...';

        document.getElementById('spinBtn').disabled = true;

        const n = slotCount();
        const slice = (2 * Math.PI) / n;
        const targetIndex = filledIndices[Math.floor(Math.random() * filledIndices.length)];

        const targetCenter = targetIndex * slice + slice / 2;
        const randomOffset = (Math.random() * 0.6 - 0.3) * slice;
        const targetAngle = -Math.PI / 2 - targetCenter + randomOffset;

        const normalizedCurrent = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const normalizedTarget = ((targetAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

        let delta = normalizedTarget - normalizedCurrent;
        if (delta < 0) delta += 2 * Math.PI;

        const extraRot = Math.floor(5 + Math.random() * 6) * 2 * Math.PI;
        const finalAngle = currentAngle + extraRot + delta;
        const duration = 4200 + Math.random() * 1400;
        const startAngle = currentAngle;
        const startTime = performance.now();

        function easeOut(t) { return 1 - Math.pow(1 - t, 4); }
        function animate(now) {
            const t = Math.min((now - startTime) / duration, 1);
            currentAngle = startAngle + (finalAngle - startAngle) * easeOut(t);
            drawWheel(currentAngle);
            if (t < 1) {
                requestAnimationFrame(animate);
            } else {
                currentAngle = finalAngle;
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                showResult(slots[targetIndex]);
            }
        }
        requestAnimationFrame(animate);
    }

    function showResult(r) {
        document.getElementById('resultLabel').style.display = '';
        document.getElementById('resultName').innerHTML = `<span class="emoji-icon">🍽️</span> ${r.name}`;
        
        const meta = [];
        if (r.price) meta.push(`💰 ${r.price.toLocaleString()}원`);
        if (r.hours && r.hours !== '미확인') meta.push(`🕐 ${r.hours}`);
        document.getElementById('resultMeta').textContent = meta.join('  ·  ');

        const linksEl = document.getElementById('resultLinks');
        linksEl.innerHTML = '';
        if (r.instagram) {
            const a = document.createElement('a');
            a.href = r.instagram; a.target = '_blank'; a.rel = 'noopener';
            a.className = 'result-link-btn instagram';
            a.innerHTML = '📸 인스타그램';
            linksEl.appendChild(a);
        }
        if (r.kakao) {
            const a = document.createElement('a');
            a.href = r.kakao; a.target = '_blank'; a.rel = 'noopener';
            a.className = 'result-link-btn kakao';
            a.innerHTML = '💬 카카오채널';
            linksEl.appendChild(a);
        }

        const card = document.getElementById('resultCard');
        card.classList.add('visible');
        setTimeout(() => { card.classList.remove('visible'); }, 400);
    }

    function resetLunchResult() {
        document.getElementById('resultLabel').style.display = 'block';
        document.getElementById('resultName').innerHTML = '<span class="emoji-icon">🤔</span> 무엇이 나올까요?';
        document.getElementById('resultMeta').textContent = '돌려돌려 버튼을 눌러 운명을 확인하세요!';
        document.getElementById('resultLinks').innerHTML = '';
    }

    window.addEventListener('resize', () => {
        syncCanvasResolution();
        drawWheel(currentAngle);
        closeSlotEditor(); // 리사이즈되면 편집창 위치가 어긋나므로 그냥 닫음
    });

    // 편집창 바깥(캔버스도, 편집창 자신도 아닌 곳)을 클릭하면 닫음. 캔버스 클릭은
    // 자체 리스너가 편집창을 열거나 다른 조각으로 옮기는 용도라 여기서는 제외.
    // 탭이 다시 열릴 때마다 스크립트가 재실행되므로 이전 리스너를 지우고 새로
    // 등록해 document에 계속 쌓이지 않게 함.
    if (window.__rouletteOutsideClickHandler) {
        document.removeEventListener('click', window.__rouletteOutsideClickHandler);
    }
    window.__rouletteOutsideClickHandler = function(e) {
        const editor = document.getElementById('rouletteSlotEditor');
        if (!editor || editor.hidden) return;
        if (e.target === canvas || editor.contains(e.target)) return;
        closeSlotEditor();
    };
    document.addEventListener('click', window.__rouletteOutsideClickHandler);

    // 최초 초기화 — DOM이 레이아웃된 후 실행
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            setGlobalMode('mini');
        });
    });

    return { setMode, spin, resetLunchResult, onEditorInput, pickEditorOption, clearEditorSlot, autoArrange };
})();
</script>
